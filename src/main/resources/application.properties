spring.application.name=vortexweb
spring.docker.compose.skip.in-tests=false
spring.jpa.hibernate.ddl-auto=update
vortex.admin.username=admin
vortex.admin.password=admin
vortex.booking.default-duration-minutes=60
vortex.notifications.email.base-url=https://api.resend.com
# Set the RESEND_API_KEY environment variable -- never commit a real key here.
vortex.notifications.email.api-key=${RESEND_API_KEY:changeme}
# Resend's shared sandbox sender: works with no domain verification, but only delivers to the
# email address on the Resend account. Swap for a verified-domain address once one exists.
vortex.notifications.email.from-address=onboarding@resend.dev
# Placeholder content -- replace with the real artist name/bio/links before launch.
vortex.artist.name=VortEx Tattoo
vortex.artist.bio=Custom tattoo art blending fine line and bold color work. Every piece is designed one-on-one with the client. (Placeholder bio -- replace with the real one.)
vortex.artist.instagram-url=#
vortex.artist.email=hello@example.com
